<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | Nail Glam</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    h2.section-title {
      color: var(--primary);
      font-size: 2rem;
      margin-bottom: 25px;
      text-align: center;
      text-shadow: 0 2px 8px var(--primary-glow);
    }
    .profile-container {
      max-width: 560px;
      margin: 30px auto;
      padding: 0 20px 100px;
    }
    .profile-card {
      background: var(--bg-surface-solid);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: var(--shadow-sm);
    }
    .profile-card .profile-sidebar-avatar {
      margin: 0 auto 12px;
    }
    .profile-card .profile-edit-hint {
      text-align: center;
    }
    .profile-card .profile-row {
      gap: 14px;
    }
    .profile-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
    }
    .profile-actions .btn {
      width: 100%;
    }
    .profile-link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-surface-solid);
      cursor: pointer;
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      transition: 0.2s;
      text-decoration: none;
    }
    .profile-link-row:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .profile-link-row span {
      font-size: 1.3rem;
      color: var(--primary);
    }
    @media (min-width: 600px) {
      .profile-actions {
        flex-direction: row;
        align-items: center;
      }
      .profile-actions .btn {
        width: auto;
        flex: 1;
      }
    }
    @media (max-width: 600px) {
      h2.section-title {
        font-size: 1.5rem;
      }
      .profile-container {
        margin-top: 18px;
        padding: 0 14px 110px;
      }
      .profile-card {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Bubbles Background -->
  <div id="bubbleContainer">
    <div class="bubble small pink"></div>
    <div class="bubble medium purple"></div>
    <div class="bubble large blue"></div>
    <div class="bubble small purple"></div>
    <div class="bubble medium pink"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo-group" onclick="window.location.href='home.html'" style="cursor: pointer;">
      <img src="nglogo.png" alt="Nail Glam logo" class="header-logo" />
      <span class="logo-text">Nail Glam</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn btn-secondary header-back-btn" onclick="window.location.href='home.html'">← <span class="header-btn-label">Back to Shop</span></button>
    </div>
  </header>

  <!-- Profile Page -->
  <main class="profile-container">
    <h2 class="section-title">My Profile 👤</h2>

    <div class="profile-card">
      <div class="profile-sidebar-avatar"><span id="profilePageInitial">U</span></div>
      <p class="profile-edit-hint">Manage your account details</p>

      <div class="profile-field">
        <label for="pfName">Full Name</label>
        <input type="text" id="pfName" placeholder="Enter your full name" />
      </div>
      <div class="profile-field">
        <label for="pfEmail">Email</label>
        <input type="email" id="pfEmail" readonly />
      </div>
      <div class="profile-field">
        <label for="pfPhone">Mobile Number</label>
        <input type="tel" id="pfPhone" placeholder="10-digit mobile number" maxlength="10" />
      </div>
      <div class="profile-field">
        <label for="pfAddress">Address</label>
        <textarea id="pfAddress" rows="2" placeholder="House no, street, area"></textarea>
      </div>
      <div class="profile-row">
        <div class="profile-field">
          <label for="pfCity">City</label>
          <input type="text" id="pfCity" placeholder="City" />
        </div>
        <div class="profile-field">
          <label for="pfState">State</label>
          <input type="text" id="pfState" placeholder="State" />
        </div>
      </div>
      <div class="profile-field">
        <label for="pfPincode">PIN Code</label>
        <input type="text" id="pfPincode" placeholder="6-digit PIN code" maxlength="6" />
      </div>

      <div style="margin-top: 18px;">
        <a class="profile-link-row" href="orders.html">
          📦 My Orders <span>›</span>
        </a>
      </div>

      <div class="profile-actions">
        <button class="btn btn-primary profile-save-btn" onclick="saveProfile()">Save Changes</button>
        <button class="btn btn-secondary" id="logoutBtn">Logout</button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKuFqq1jYeUon9DgqMnaq6vg1tYDdTnPo",
      authDomain: "website-9a715.firebaseapp.com",
      projectId: "website-9a715",
      storageBucket: "website-9a715.firebasestorage.app",
      messagingSenderId: "1006565436423",
      appId: "1:1006565436423:web:a97c2176e5ead19a350ea2",
      measurementId: "G-TC1052C9MT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    function profileInitial(name, email) {
      if (name && name.trim()) {
        const initials = name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
        return initials;
      }
      return (email || 'U').trim().charAt(0).toUpperCase();
    }

    function applyInitials(name, email) {
      const letter = profileInitial(name, email);
      document.getElementById("profilePageInitial").textContent = letter;
    }

    async function loadUserProfile(user) {
      currentUser = user;
      const email = user.email || "";
      document.getElementById("pfEmail").value = email;

      let profile = null;
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) profile = snap.data();
      } catch (e) {
        console.error("Firestore profile read error:", e);
      }
      if (!profile) {
        const localKey = "userProfile_" + user.uid;
        const local = localStorage.getItem(localKey);
        if (local) {
          try { profile = JSON.parse(local); } catch (e) { profile = null; }
        }
      }

      profile = profile || {};
      const name = profile.fullName || "";
      document.getElementById("pfName").value = name;
      document.getElementById("pfPhone").value = profile.phone || "";
      document.getElementById("pfAddress").value = profile.address || "";
      document.getElementById("pfCity").value = profile.city || "";
      document.getElementById("pfState").value = profile.state || "";
      document.getElementById("pfPincode").value = profile.pincode || "";
      applyInitials(name, email);
    }

    window.saveProfile = async function () {
      if (!currentUser) return;

      const name = document.getElementById("pfName").value.trim();
      const phone = document.getElementById("pfPhone").value.trim();
      const address = document.getElementById("pfAddress").value.trim();
      const city = document.getElementById("pfCity").value.trim();
      const state = document.getElementById("pfState").value.trim();
      const pincode = document.getElementById("pfPincode").value.trim();

      if (!name) { showToast("⚠️ Please enter your name."); return; }
      if (phone && !/^[0-9]{10}$/.test(phone)) { showToast("⚠️ Phone number must be exactly 10 digits."); return; }
      if (pincode && !/^[0-9]{6}$/.test(pincode)) { showToast("⚠️ PIN code must be exactly 6 digits."); return; }

      const profile = {
        fullName: name,
        email: currentUser.email,
        phone,
        address,
        city,
        state,
        pincode,
        updatedAt: new Date().toISOString()
      };

      localStorage.setItem("userProfile_" + currentUser.uid, JSON.stringify(profile));

      try {
        await setDoc(doc(db, "users", currentUser.uid), profile);
        showToast("✅ Profile saved successfully!");
      } catch (error) {
        console.error("Firestore profile save error:", error);
        showToast("⚠️ Profile saved on this device (cloud sync failed).");
      }
      applyInitials(name, currentUser.email);
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      try { sessionStorage.setItem("currentUid", user.uid); } catch (e) {}
      await loadUserProfile(user);
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await signOut(auth);
        try { sessionStorage.removeItem("currentUid"); } catch (e) {}
        window.location.href = "index.html";
      } catch (e) {
        window.location.href = "index.html";
      }
    });

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    const bubbles = document.querySelectorAll('.bubble');
    bubbles.forEach(b => {
      b.style.left = `${Math.random() * 90}%`;
      b.style.animationDelay = `${Math.random() * 10}s`;
    });
  </script>

  <!-- Sticky Bottom Navigation (same footer as all pages) -->
  <nav class="mobile-nav-bar">
    <div class="mobile-nav-item" onclick="location.href='home.html'">
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </div>
    <div class="mobile-nav-item" onclick="location.href='home.html'">
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Search</span>
    </div>
    <div class="mobile-nav-item" onclick="location.href='cart.html'">
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Cart</span>
    </div>
    <div class="mobile-nav-item active" onclick="location.href='profile.html'">
      <svg class="mobile-nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </div>
  </nav>

  <script>
    (function() {
      var btn = document.getElementById('themeToggleBtn');
      function apply() {
        var dark = localStorage.getItem('theme') === 'dark';
        document.body.classList.toggle('dark-theme', dark);
        if (btn) btn.innerHTML = dark
          ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
          : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      }
      apply();
      if (btn) btn.addEventListener('click', function() {
        var dark = document.body.classList.toggle('dark-theme');
        localStorage.setItem('theme', dark ? 'dark' : 'light');
        apply();
      });
    })();
  </script>
  </body>
</html>
