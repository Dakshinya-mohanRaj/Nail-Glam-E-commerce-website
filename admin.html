<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Control Panel - Order Management" />
  <title>Admin Dashboard | Nail Glam 👑</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-container {
      max-width: var(--max-width);
      margin: 40px auto;
      padding: 0 20px 60px;
    }

    h2.admin-title {
      color: var(--primary);
      font-size: 2rem;
      margin-bottom: 25px;
      text-align: center;
      text-shadow: 0 2px 8px var(--primary-glow);
    }

    /* Admin statistics cards */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .stat-card {
      padding: 25px;
      text-align: center;
    }
    .stat-card h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .stat-card p {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary);
      text-shadow: 0 2px 10px var(--primary-glow);
    }

    /* Filter & Control bar */
    .admin-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 20px;
      flex-wrap: wrap;
    }
    .admin-search {
      flex-grow: 1;
      max-width: 500px;
    }

    /* Table Styling */
    .table-responsive {
      overflow-x: auto;
      border-radius: var(--corner-radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      backdrop-filter: var(--glass-blur);
    }
    table.admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    table.admin-table th, table.admin-table td {
      padding: 18px;
      border-bottom: 1px solid var(--border-color);
    }
    table.admin-table th {
      background: rgba(255, 105, 180, 0.08);
      font-weight: 700;
      color: var(--primary);
      font-size: 0.95rem;
    }
    table.admin-table tr:hover {
      background: rgba(255, 105, 180, 0.02);
    }
    table.admin-table tr:last-child td {
      border-bottom: none;
    }

    .customer-cell div {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .items-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .items-cell img {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      transition: transform 0.3s;
      cursor: zoom-in;
    }
    .items-cell img:hover {
      transform: scale(1.15);
      z-index: 10;
    }

    .status-select-wrapper select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface-solid);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Floating Bubbles Background -->
  <div id="bubbleContainer">
    <div class="bubble small pink"></div>
    <div class="bubble medium purple"></div>
    <div class="bubble large blue"></div>
    <div class="bubble small purple"></div>
    <div class="bubble medium pink"></div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="logo-group" onclick="window.location.href='home.html'" style="cursor: pointer;">
      <img src="nglogo.png" alt="Nail Glam logo" class="header-logo" />
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="window.location.href='home.html'">Go to Shop</button>
    </div>
  </header>

  <!-- Admin dashboard -->
  <main class="admin-container">
    <h2 class="admin-title">Order Dashboard 👑</h2>

    <!-- Stats summary card row -->
    <div class="admin-stats">
      <div class="stat-card card-glass">
        <h3>Total Orders</h3>
        <p id="totalOrders">0</p>
      </div>
      <div class="stat-card card-glass">
        <h3>Pending Orders</h3>
        <p id="pendingOrders" style="color: #ff9f43; text-shadow: 0 2px 10px rgba(255, 159, 67, 0.4);">0</p>
      </div>
      <div class="stat-card card-glass">
        <h3>Shipped</h3>
        <p id="shippedOrders" style="color: #54a0ff; text-shadow: 0 2px 10px rgba(84, 160, 255, 0.4);">0</p>
      </div>
      <div class="stat-card card-glass">
        <h3>Delivered</h3>
        <p id="deliveredOrders" style="color: #10ac84; text-shadow: 0 2px 10px rgba(16, 172, 132, 0.4);">0</p>
      </div>
    </div>

    <!-- Filter & Refresh tools -->
    <div class="admin-controls">
      <div class="admin-search">
        <input type="text" id="adminSearchInput" class="form-control" placeholder="🔍 Search orders by customer name, phone, email, or status..." />
      </div>
      <button class="btn btn-primary" onclick="loadOrders()">Reload Live Data 🔄</button>
    </div>

    <!-- Orders Management Table -->
    <div class="table-responsive">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Order Ref</th>
            <th>Customer Information</th>
            <th>Items Purchased</th>
            <th>Total Cost</th>
            <th>Delivery Status</th>
            <th>Placement Date</th>
          </tr>
        </thead>
        <tbody id="orderTableBody">
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading live customer order registry...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCKuFqq1jYeUon9DgqMnaq6vg1tYDdTnPo",
      authDomain: "website-9a715.firebaseapp.com",
      projectId: "website-9a715",
      storageBucket: "website-9a715.firebasestorage.app",
      messagingSenderId: "1006565436423",
      appId: "1:1006565436423:web:a97c2176e5ead19a350ea2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Verify Admin authentication
    const ADMIN_EMAIL = "admin@gmail.com";
    onAuthStateChanged(auth, (user) => {
      if (!user || user.email !== ADMIN_EMAIL) {
        alert("Access Denied: Admin authentication required.");
        window.location.href = "home.html";
      } else {
        loadOrders();
      }
    });

    // Build a unique fingerprint for an order to de-duplicate the cloud copy
    // from the local-storage copy of the same order.
    function orderKey(order) {
      return [
        order.date || "",
        order.total || 0,
        order.paymentMethod || "",
        (order.items || []).map(it => (it.name || "") + "x" + (it.qty || 1)).join(",")
      ].join("|");
    }

    async function loadOrders() {
      const orderTableBody = document.getElementById("orderTableBody");
      orderTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Connecting to registry database...</td></tr>';
      
      let cloudOrders = [];

      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        querySnapshot.forEach((docSnap) => {
          cloudOrders.push({ id: docSnap.id, data: docSnap.data() });
        });
      } catch (error) {
        console.warn("Firestore read failed (showing local orders only):", error);
      }

      // Merge locally saved orders from all users so admin sees everything
      let localOrders = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith("nailArtLocalOrders_")) {
            const arr = JSON.parse(localStorage.getItem(key) || "[]");
            if (Array.isArray(arr)) localOrders = localOrders.concat(arr);
          }
        }
      } catch (e) { /* ignore malformed local orders */ }

      // De-duplicate: skip local copies that already exist in the cloud,
      // so a synced order isn't shown twice (once as cloud, once tagged local).
      const cloudFingerprints = new Set(cloudOrders.map(o => orderKey(o.data)));
      const uniqueLocal = localOrders.filter(o => !cloudFingerprints.has(orderKey(o)));

      const combined = [
        ...cloudOrders.map(o => ({ id: o.id, data: o.data, local: false })),
        ...uniqueLocal.map(o => ({ id: o.id || ("local-" + Date.now()), data: o, local: true }))
      ];

      orderTableBody.innerHTML = '';

      let total = 0, pending = 0, shipped = 0, delivered = 0;

      combined.forEach(({ id, data: order, local }) => {
        total++;

        if (order.status === "Pending") pending++;
        else if (order.status === "Shipped") shipped++;
        else if (order.status === "Delivered") delivered++;

        const tr = document.createElement("tr");
        tr.setAttribute("data-searchable", `${id} ${order.customerName} ${order.phone} ${order.status}`.toLowerCase());

        // Customer details block
        const customerCell = `
          <div class="customer-cell">
            <strong>${order.customerName || "Guest"}${local ? ' <span style="color:var(--secondary);font-size:0.8rem;">(local)</span>' : ''}</strong>
            <div>📞 ${order.phone || "N/A"}</div>
            <div>📍 ${order.address || "N/A"}</div>
          </div>
        `;

        // Items thumbnails block
        const itemsCell = `
          <div class="items-cell">
            ${(order.items || []).map(item => `
              <img src="${item.image || "https://via.placeholder.com/44"}" 
                   title="${item.name || "Product"} (x${item.qty || 1})" 
                   alt="${item.name || "Product"}" />
            `).join('')}
          </div>
        `;

        const statusOptions = ["Pending", "Shipped", "Delivered"]
          .map(s => `<option value="${s}" ${order.status === s ? 'selected' : ''}>${s}</option>`)
          .join('');

        tr.innerHTML = `
          <td style="font-family: monospace; font-weight: 700;">#${String(id).substring(0, 8).toUpperCase()}</td>
          <td>${customerCell}</td>
          <td>${itemsCell}</td>
          <td style="font-weight: 700; color: var(--secondary);">₹${order.total || 0}</td>
          <td class="status-select-wrapper">
            <select data-order-id="${id}" onchange="updateStatus('${id}', this.value)">
              ${statusOptions}
            </select>
          </td>
          <td style="font-size: 0.85rem; color: var(--text-muted);">${order.date || "N/A"}</td>
        `;
        orderTableBody.appendChild(tr);
      });

      // Update card metrics
      document.getElementById("totalOrders").textContent = total;
      document.getElementById("pendingOrders").textContent = pending;
      document.getElementById("shippedOrders").textContent = shipped;
      document.getElementById("deliveredOrders").textContent = delivered;

      // Re-apply searches if query exists
      filterOrders();

      if (combined.length === 0) {
        orderTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No orders placed yet.</td></tr>';
      }
    }

    // Update Live status handler
    window.updateStatus = async (orderId, newStatus) => {
      // Local-order status updates (not backed by Firestore)
      if (String(orderId).startsWith("local-")) {
        try {
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith("nailArtLocalOrders_")) {
              const arr = JSON.parse(localStorage.getItem(key) || "[]");
              const target = arr.find(o => o.id === orderId);
              if (target) {
                target.status = newStatus;
                localStorage.setItem(key, JSON.stringify(arr));
                showLocalAlert(`💅 Order #${orderId.substring(0, 8).toUpperCase()} status shifted to: ${newStatus} (local)`);
                loadOrders();
                return;
              }
            }
          }
        } catch (e) { /* ignore */ }
      }

      try {
        const orderRef = doc(db, "orders", orderId);
        await updateDoc(orderRef, { status: newStatus });
        
        // Success alert
        showLocalAlert(`💅 Order #${orderId.substring(0,6).toUpperCase()} status shifted to: ${newStatus}`);
        loadOrders(); // Refresh status counters

      } catch (error) {
        console.error("Database write error:", error);
        alert("Transaction permission error: " + error.message);
      }
    };

    function showLocalAlert(msg) {
      // Basic toast trigger in admin
      const alertDiv = document.createElement("div");
      alertDiv.className = "toast show";
      alertDiv.textContent = msg;
      document.body.appendChild(alertDiv);
      setTimeout(() => {
        alertDiv.classList.remove("show");
        setTimeout(() => alertDiv.remove(), 400);
      }, 3000);
    }

    // Admin filter search listener
    const searchInput = document.getElementById("adminSearchInput");
    searchInput.addEventListener("input", filterOrders);

    function filterOrders() {
      const query = searchInput.value.toLowerCase().trim();
      const rows = document.querySelectorAll("#orderTableBody tr");
      
      rows.forEach(row => {
        const text = row.getAttribute("data-searchable");
        if (!text) return; // Skip loaders or errors
        
        if (text.includes(query)) {
          row.style.display = "";
        } else {
          row.style.display = "none";
        }
      });
    }

    window.loadOrders = loadOrders;
    document.addEventListener("DOMContentLoaded", () => {
      const bubbles = document.querySelectorAll(".bubble");
      bubbles.forEach(b => {
        b.style.left = `${Math.random() * 90}%`;
        b.style.animationDelay = `${Math.random() * 10}s`;
      });
    });
  </script>
</body>
</html>
